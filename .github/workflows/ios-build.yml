name: CI crash evidence
on:
  workflow_dispatch:
    inputs:
      evidence_run:
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - name: Extract existing test diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_RUN: ${{ inputs.evidence_run }}
        run: |
          mkdir -p Evidence Diagnostics
          gh run download "$EVIDENCE_RUN" --repo "$GITHUB_REPOSITORY" -n interface-screens -D Evidence
          xcrun xcresulttool help export diagnostics
          n=0
          while IFS= read -r -d '' result; do
            n=$((n+1))
            xcrun xcresulttool export diagnostics --path "$result" --output-path "Diagnostics/result$n"
            xcrun xcresulttool get test-results summary --path "$result" > "Diagnostics/summary$n.json"
          done < <(find Evidence -type d -name '*.xcresult' -print0)
          find Diagnostics -type f -maxdepth 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build169 crash diagnostics
          path: Diagnostics/**
          if-no-files-found: error
