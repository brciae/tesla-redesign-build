name: iOS Build v71
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install xcodegen
      - name: Node route-gate / freshness tests
        run: node tools/js-logic-tests.cjs
      - name: Build (parse, policy tests, interface probe, unsigned IPA)
        run: bash tools/build-ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: YLCompanion-v71
          path: Xcode/BuildOutput/*.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interface-screens
          path: Xcode/**/*.xcresult
          if-no-files-found: ignore
