name: iOS Build
on:
  workflow_dispatch:
    inputs:
      skip_shared_interface:
        description: Reuse a completed interface run only when Probe sources are unchanged
        type: boolean
        default: false
      skip_production_ui:
        description: Use a separate same-source production UI run
        type: boolean
        default: false
      production_ui_only:
        description: Test production screens only without creating another IPA
        type: boolean
        default: false
      artifact_run_id:
        description: Export review attachments from a previous production UI artifact only
        type: string
        required: false
      ui_screens_only:
        description: Run shared interface checks only (no IPA)
        type: boolean
        default: false
      probe_focus:
        description: Focus for screenshot-only diagnostic runs (full builds always run all tests)
        type: choice
        options: [all, fullscreen, junction, new, island, regression, menu]
        default: fullscreen
  push:
    branches: [main]
jobs:
  build:
    if: inputs.ui_screens_only != true && !inputs.artifact_run_id && inputs.production_ui_only != true
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Read app version
        id: version
        run: |
          node -e 'const fs=require("fs"),s=require("./Xcode/project.json").settings.base; fs.appendFileSync(process.env.GITHUB_OUTPUT, "version="+s.MARKETING_VERSION+"\nbuild="+s.CURRENT_PROJECT_VERSION+"\n");'
      - name: Tools
        run: brew install xcodegen
      - name: Node route-gate / freshness tests
        run: node tools/js-logic-tests.cjs
      - name: Offline guidance quality review tests (no AI calls)
        run: python3 -m unittest discover -s tools -p test_navigation_quality_review.py
      - name: Native build and policy tests
        env:
          RUN_INTERFACE_TESTS: "0"
          UI_SCREENS_ONLY: ${{ inputs.ui_screens_only }}
          PROBE_FOCUS: ${{ inputs.probe_focus }}
        run: |
          if [[ "$UI_SCREENS_ONLY" == true ]]; then
            bash tools/test-interface.sh "${PROBE_FOCUS:-fullscreen}"
          else
            bash tools/build-ios.sh
          fi
      - uses: actions/upload-artifact@v4
        if: inputs.ui_screens_only != true
        with:
          name: App-Tesla ${{ steps.version.outputs.version }} Build${{ steps.version.outputs.build }} v01 Review
          path: Xcode/BuildOutput/*.ipa
  production-ui:
    needs: build
    if: always() && !cancelled() && inputs.skip_production_ui != true && !inputs.artifact_run_id && inputs.ui_screens_only != true && (inputs.production_ui_only == true || needs.build.result == 'success')
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Prepare production simulator project
        run: |
          brew install xcodegen
          for part in part*.zip; do
            [ -e "$part" ] || continue
            unzip -oq "$part"
          done
          node tools/embed-js.cjs
          swift tools/prepare-icon.swift
          xcodegen generate --spec Xcode/project.json --project Xcode
          xcodebuild -resolvePackageDependencies -project Xcode/YLCompanion.xcodeproj -scheme YLCompanion -clonedSourcePackagesDirPath Xcode/SourcePackages
      - name: Test actual production screens
        run: bash tools/test-production-ui.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-screens
          path: |
            Xcode/ProductionResults.xcresult
            Xcode/BuildOutput/InterfaceScreens/**
          if-no-files-found: ignore
  interface:
    needs: build
    if: always() && inputs.skip_shared_interface != true && (inputs.ui_screens_only == true || needs.build.result == 'success')
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Prepare tools and resources
        run: |
          brew install xcodegen
          for part in part*.zip; do
            [ -e "$part" ] || continue
            unzip -oq "$part"
          done
          node tools/embed-js.cjs
      - name: Test shared interface and lifecycle
        env:
          UI_SCREENS_ONLY: ${{ inputs.ui_screens_only }}
          PROBE_FOCUS: ${{ inputs.probe_focus }}
        run: |
          if [[ "$UI_SCREENS_ONLY" == true ]]; then
            bash tools/test-interface.sh "${PROBE_FOCUS:-fullscreen}"
          else
            bash tools/test-interface.sh
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interface-screens
          path: |
            Xcode/InterfaceResults.xcresult
            Xcode/BuildOutput/InterfaceScreens/**
          if-no-files-found: ignore
  extract-production-artifacts:
    if: inputs.artifact_run_id != ''
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Export existing production UI screenshots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh run download "$RUN_ID" --name production-screens --dir Xcode/ReviewBundle
          result="$(python3 -c 'from pathlib import Path; print(next(Path("Xcode/ReviewBundle").rglob("*.xcresult")))')"
          mkdir -p Xcode/BuildOutput/ProductionReviewArtifacts
          xcrun xcresulttool export attachments --path "$result" --output-path Xcode/BuildOutput/ProductionReviewArtifacts
          xcrun xcresulttool get test-results summary --path "$result" > Xcode/BuildOutput/ProductionReviewArtifacts/summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: production-review-attachments
          path: Xcode/BuildOutput/ProductionReviewArtifacts/**
