name: iOS Build
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Read app version
        id: version
        run: |
          node -e 'const fs=require("fs"),s=require("./Xcode/project.json").settings.base; fs.appendFileSync(process.env.GITHUB_OUTPUT, "version="+s.MARKETING_VERSION+"\nbuild="+s.CURRENT_PROJECT_VERSION+"\n");'
      - name: Tools
        run: brew install xcodegen
      - name: Node route-gate / freshness tests
        run: node tools/js-logic-tests.cjs
      - name: Build (parse, policy tests, interface probe, unsigned IPA)
        run: bash tools/build-ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: App-Tesla ${{ steps.version.outputs.version }} Build${{ steps.version.outputs.build }} v01 Review
          path: Xcode/BuildOutput/*.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interface-screens
          path: Xcode/**/*.xcresult
          if-no-files-found: ignore
