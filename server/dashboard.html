<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YL Companion 차량 현황</title><link rel="stylesheet" href="/dashboard.css"></head><body><main><header><span>YL COMPANION</span><h1>차량 현황</h1><p>읽기 전용 · 최근 관측값만 표시</p></header><form id="connect"><label>대시보드용 차량 VIN<input id="vin" autocomplete="off" maxlength="17" required></label><label>대시보드 전용 키<input id="token" type="password" autocomplete="off" required></label><button type="submit">연결</button></form><button id="disconnect" hidden>연결 해제·화면 지우기</button><p id="status" role="status">NAS에서 대시보드용 키와 차량 범위를 설정한 경우에만 연결 가능함.</p><div id="fields"></div><footer>키는 브라우저 저장소·URL에 저장하지 않음. 이 페이지를 벗어나면 연결이 해제됨. 앱의 과거 통계와 구분되는 현재 관측 화면임.</footer></main><script src="/dashboard.js"></script></body></html>
